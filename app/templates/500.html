{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h2 class="h4 text-secondary mb-3">Internal Server Error</h2>
    <p class="text-muted mb-4">Something unexpected went wrong on our end. Please try again or return home.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-success">
        <i class="fa-solid fa-house me-1"></i> Back to Safety
    </a>
</div>
{% endblock %}
