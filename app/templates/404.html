{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-muted mb-3">404</div>
    <h2 class="h4 text-secondary mb-3">Oops! The page you requested could not be found.</h2>
    <p class="text-muted mb-4">It looks like the link is broken or the page has been moved.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-success">
        <i class="fa-solid fa-house me-1"></i> Return to Home
    </a>
</div>
{% endblock %}
